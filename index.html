<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Открываю заказ…</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:48px 20px;color:#222}
a#app{display:block;margin:24px auto 12px;padding:18px;max-width:320px;border-radius:12px;background:#2a7fff;color:#fff;font-size:18px;text-decoration:none}
a#web{color:#2a7fff}
#links{display:none}
</style>
</head>
<body>
<p id="msg">Открываю заказ…</p>
<div id="links">
<a id="app" href="#">Открыть в приложении</a>
<a id="web" href="#">Открыть на сайте Профи</a>
</div>
<script>
(function () {
  var APP_TEMPLATE = "backoffice-react-app://&sub1=order&sub2={id}";
  var FALLBACK_MS = 1200;
  var id = new URLSearchParams(location.search).get("id");
  if (!id || !/^\d{1,18}$/.test(id)) {
    document.body.textContent = "Неверная ссылка";
    return;
  }
  var web = "https://profi.ru/backoffice/n.php?o=" + id;
  var app = APP_TEMPLATE.replace("{id}", id);
  document.getElementById("app").href = app;
  document.getElementById("web").href = web;
  var ua = navigator.userAgent;
  // приложение исполнителя пробуем только на телефонах; ПК (и iPad, который выдаёт себя за Mac) — сразу на сайт
  var mobile = /iPhone|iPod|Android/i.test(ua);
  // пока грузится Профи, браузер держит эту страницу — без кнопок, чтобы не было «выбора»
  if (!mobile) {
    document.getElementById("msg").textContent = "Открываю заказ на сайте Профи…";
    location.replace(web);
    return;
  }
  document.getElementById("msg").textContent = "Открываю заказ в приложении Профи…";
  document.getElementById("links").style.display = "block";
  var left = false;
  var timer = null;
  // приложение открылось: вкладка больше не нужна (Safari не даст закрыть чужую вкладку, браузер Telegram — может)
  function done() {
    document.getElementById("msg").textContent = "Заказ открыт в приложении. Эту страницу можно закрыть.";
    document.getElementById("app").textContent = "Открыть заказ ещё раз";
    try { window.close(); } catch (e) {}
  }
  function gone() {
    left = true;
    if (timer) { clearTimeout(timer); timer = null; }
    done();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { gone(); } else if (left) { done(); }
  });
  window.addEventListener("pagehide", gone);
  window.addEventListener("pageshow", function (e) { if (e.persisted && left) { done(); } });
  timer = setTimeout(function () {
    if (!left) { location.replace(web); }
  }, FALLBACK_MS);
  location.href = app;
})();
</script>
</body>
</html>
